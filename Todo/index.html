<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
            --danger-color: #f72585;
            --gray-color: #adb5bd;
            --bg-color: #ffffff;
            --text-color: #212529;
            --card-bg: #f8f9fa;
            --border-color: #dee2e6;
        }

        .dark-mode {
            --primary-color: #4895ef;
            --secondary-color: #4361ee;
            --accent-color: #3f37c9;
            --light-color: #212529;
            --dark-color: #f8f9fa;
            --bg-color: #121212;
            --text-color: #f8f9fa;
            --card-bg: #1e1e1e;
            --border-color: #343a40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-color);
        }

        .app-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-color);
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .task-form {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .task-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .task-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            border-left: 5px solid var(--gray-color);
        }

        .task-card.high {
            border-left-color: var(--danger-color);
        }

        .task-card.medium {
            border-left-color: var(--warning-color);
        }

        .task-card.low {
            border-left-color: var(--success-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .task-category {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            background-color: var(--accent-color);
            color: white;
            margin-bottom: 10px;
        }

        .task-description {
            color: var(--text-color);
            opacity: 0.9;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .task-due-date {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .task-due-date i {
            color: var(--accent-color);
        }

        .task-priority {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .priority-high {
            background-color: rgba(247, 37, 133, 0.2);
            color: var(--danger-color);
        }

        .priority-medium {
            background-color: rgba(248, 150, 30, 0.2);
            color: var(--warning-color);
        }

        .priority-low {
            background-color: rgba(76, 201, 240, 0.2);
            color: var(--success-color);
        }

        .task-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .task-complete {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-complete input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-complete label {
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 5px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--gray-color);
        }

        .action-buttons button:hover {
            color: var(--accent-color);
        }

        .completed {
            opacity: 0.7;
            position: relative;
        }

        .completed::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            pointer-events: none;
        }

        .dark-mode .completed::after {
            background-color: rgba(0, 0, 0, 0.5);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .app-controls {
                flex-direction: column;
            }
            
            .filter-controls {
                flex-direction: column;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .task-list {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Advanced To-Do List</h1>
            <button class="theme-toggle" id="themeToggle">🌓</button>
        </header>

        <div class="app-controls">
            <div class="search-box">
                <i>🔍</i>
                <input type="text" id="searchInput" placeholder="Search tasks...">
            </div>
            <div class="filter-controls">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="shopping">Shopping</option>
                    <option value="other">Other</option>
                </select>
                <select id="priorityFilter">
                    <option value="all">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
        </div>

        <div class="task-form">
            <h2>Add New Task</h2>
            <form id="addTaskForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskTitle">Title*</label>
                        <input type="text" id="taskTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="high">High</option>
                            <option value="medium" selected>Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Add Task</button>
            </form>
        </div>

        <div class="task-list" id="taskList">
            <!-- Tasks will be dynamically inserted here -->
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalTasks">0</div>
                <div>Total Tasks</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="completedTasks">0</div>
                <div>Completed</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="pendingTasks">0</div>
                <div>Pending</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="highPriorityTasks">0</div>
                <div>High Priority</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const themeToggle = document.getElementById('themeToggle');
            const addTaskForm = document.getElementById('addTaskForm');
            const taskList = document.getElementById('taskList');
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const priorityFilter = document.getElementById('priorityFilter');
            const statusFilter = document.getElementById('statusFilter');
            const totalTasksEl = document.getElementById('totalTasks');
            const completedTasksEl = document.getElementById('completedTasks');
            const pendingTasksEl = document.getElementById('pendingTasks');
            const highPriorityTasksEl = document.getElementById('highPriorityTasks');

            // State
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

            // Initialize
            renderTasks();
            updateStats();

            // Theme Toggle
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });

            // Check for saved theme preference
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }

            // Add Task Form
            addTaskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const title = document.getElementById('taskTitle').value;
                const category = document.getElementById('taskCategory').value;
                const description = document.getElementById('taskDescription').value;
                const dueDate = document.getElementById('taskDueDate').value;
                const priority = document.getElementById('taskPriority').value;
                
                const newTask = {
                    id: Date.now(),
                    title,
                    category,
                    description,
                    dueDate,
                    priority,
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                tasks.push(newTask);
                saveTasks();
                renderTasks();
                updateStats();
                
                // Reset form
                addTaskForm.reset();
                document.getElementById('taskTitle').focus();
            });

            // Filter and Search
            [searchInput, categoryFilter, priorityFilter, statusFilter].forEach(element => {
                element.addEventListener('change', filterTasks);
                element.addEventListener('input', filterTasks);
            });

            // Render Tasks
            function renderTasks(tasksToRender = tasks) {
                taskList.innerHTML = '';
                
                if (tasksToRender.length === 0) {
                    taskList.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No tasks found. Add a new task to get started!</p>';
                    return;
                }
                
                tasksToRender.forEach(task => {
                    const taskElement = document.createElement('div');
                    taskElement.className = `task-card ${task.priority} ${task.completed ? 'completed' : ''}`;
                    taskElement.innerHTML = `
                        <div class="task-header">
                            <div>
                                <h3 class="task-title">${task.title}</h3>
                                <span class="task-category">${formatCategory(task.category)}</span>
                            </div>
                            <span class="task-priority priority-${task.priority}">${task.priority}</span>
                        </div>
                        ${task.description ? `<p class="task-description">${task.description}</p>` : ''}
                        ${task.dueDate ? `
                            <div class="task-due-date">
                                <i>📅</i>
                                <span>Due: ${formatDate(task.dueDate)}</span>
                            </div>
                        ` : ''}
                        <div class="task-actions">
                            <div class="task-complete">
                                <input type="checkbox" id="complete-${task.id}" ${task.completed ? 'checked' : ''}>
                                <label for="complete-${task.id}">Completed</label>
                            </div>
                            <div class="action-buttons">
                                <button class="edit-btn" data-id="${task.id}">✏️</button>
                                <button class="delete-btn" data-id="${task.id}">🗑️</button>
                            </div>
                        </div>
                    `;
                    
                    taskList.appendChild(taskElement);
                });
                
                // Add event listeners to new elements
                document.querySelectorAll('.task-complete input').forEach(checkbox => {
                    checkbox.addEventListener('change', toggleTaskComplete);
                });
                
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', deleteTask);
                });
                
                document.querySelectorAll('.edit-btn').forEach(button => {
                    button.addEventListener('click', editTask);
                });
            }

            // Filter Tasks
            function filterTasks() {
                const searchTerm = searchInput.value.toLowerCase();
                const category = categoryFilter.value;
                const priority = priorityFilter.value;
                const status = statusFilter.value;
                
                const filteredTasks = tasks.filter(task => {
                    const matchesSearch = task.title.toLowerCase().includes(searchTerm) || 
                                         task.description.toLowerCase().includes(searchTerm);
                    const matchesCategory = category === 'all' || task.category === category;
                    const matchesPriority = priority === 'all' || task.priority === priority;
                    const matchesStatus = status === 'all' || 
                                         (status === 'completed' && task.completed) || 
                                         (status === 'pending' && !task.completed);
                    
                    return matchesSearch && matchesCategory && matchesPriority && matchesStatus;
                });
                
                renderTasks(filteredTasks);
            }

            // Toggle Task Completion
            function toggleTaskComplete(e) {
                const taskId = parseInt(e.target.id.split('-')[1]);
                const task = tasks.find(task => task.id === taskId);
                
                if (task) {
                    task.completed = e.target.checked;
                    saveTasks();
                    renderTasks();
                    updateStats();
                }
            }

            // Delete Task
            function deleteTask(e) {
                if (confirm('Are you sure you want to delete this task?')) {
                    const taskId = parseInt(e.target.dataset.id);
                    tasks = tasks.filter(task => task.id !== taskId);
                    saveTasks();
                    renderTasks();
                    updateStats();
                }
            }

            // Edit Task
            function editTask(e) {
                const taskId = parseInt(e.target.dataset.id);
                const task = tasks.find(task => task.id === taskId);
                
                if (task) {
                    document.getElementById('taskTitle').value = task.title;
                    document.getElementById('taskCategory').value = task.category;
                    document.getElementById('taskDescription').value = task.description || '';
                    document.getElementById('taskDueDate').value = task.dueDate || '';
                    document.getElementById('taskPriority').value = task.priority;
                    
                    // Remove the task from the array
                    tasks = tasks.filter(t => t.id !== taskId);
                    saveTasks();
                    renderTasks();
                    updateStats();
                    
                    // Scroll to form
                    document.getElementById('taskTitle').focus();
                }
            }

            // Save Tasks to Local Storage
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            // Update Statistics
            function updateStats() {
                const total = tasks.length;
                const completed = tasks.filter(task => task.completed).length;
                const pending = total - completed;
                const highPriority = tasks.filter(task => task.priority === 'high').length;
                
                totalTasksEl.textContent = total;
                completedTasksEl.textContent = completed;
                pendingTasksEl.textContent = pending;
                highPriorityTasksEl.textContent = highPriority;
            }

            // Helper Functions
            function formatDate(dateString) {
                if (!dateString) return '';
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString(undefined, options);
            }

            function formatCategory(category) {
                return category.charAt(0).toUpperCase() + category.slice(1);
            }
        });
    </script>
</body>
</html>
